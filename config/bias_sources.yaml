    category: alternative

# Factual rating scale
factual_ratings:
  very_low: 1
  low: 2
  mixed: 3
  mostly_factual: 4
  high: 5
  very_high: 6

# Bias labels
bias_labels:
  -4: "Far Left"
  -3: "Left"
  -2: "Lean Left"
  -1: "Slight Left"
  0: "Center"
  1: "Slight Right"
  2: "Lean Right"
  3: "Right"
  4: "Far Right"
