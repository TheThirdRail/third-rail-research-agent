  "dailywire.com":
    bias: 3
    factual: mostly_factual
    name: Daily Wire
    
  "nationalreview.com":
    bias: 3
    factual: mostly_factual
    name: National Review
    
  "theblaze.com":
    bias: 3
    factual: mixed
    name: The Blaze

  # === FAR RIGHT (+4) ===
  "breitbart.com":
    bias: 4
    factual: mixed
    name: Breitbart
    
  "thegatewaypundit.com":
