# Known Source Bias Ratings
# Pre-configured ratings for common news sources
# Scale: -4 (Far Left) to +4 (Far Right), 0 = Center

sources:
  # === CENTER (0) ===
  "reuters.com": 
    bias: 0
    factual: high
    name: Reuters
    
  "apnews.com":
    bias: 0
    factual: high
    name: Associated Press
    
  "c-span.org":
    bias: 0
    factual: high
    name: C-SPAN
    
  "thehill.com":
    bias: 0
    factual: mostly_factual
    name: The Hill

  # === SLIGHT LEFT (-1) ===
  "npr.org":
    bias: -1
    factual: high
    name: NPR
    
  "bbc.com":
    bias: -1
    factual: high
    name: BBC
    
  "bbc.co.uk":
    bias: -1
    factual: high
    name: BBC
    
  "pbs.org":
    bias: -1
    factual: high
    name: PBS

  # === LEAN LEFT (-2) ===
  "nytimes.com":
    bias: -2
    factual: high
    name: New York Times
    
  "washingtonpost.com":
    bias: -2
    factual: high
    name: Washington Post
    
  "cnn.com":
    bias: -2
    factual: mixed
    name: CNN
    
  "theguardian.com":
    bias: -2
    factual: mostly_factual
    name: The Guardian
    
  "politico.com":
    bias: -2
    factual: mostly_factual
    name: Politico

  # === LEFT (-3) ===
  "msnbc.com":
    bias: -3
    factual: mixed
    name: MSNBC
    
  "huffpost.com":
    bias: -3
    factual: mostly_factual
    name: HuffPost
    
  "vox.com":
    bias: -3
    factual: mostly_factual
    name: Vox
    
  "slate.com":
    bias: -3
