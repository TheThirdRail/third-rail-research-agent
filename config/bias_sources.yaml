    name: Gateway Pundit
    
  "infowars.com":
    bias: 4
    factual: very_low
    name: InfoWars

  # === LIBERTARIAN (special category) ===
  "reason.com":
    bias: 0
    factual: mostly_factual
    name: Reason
    category: libertarian
    
  "mises.org":
    bias: 0
    factual: mostly_factual
    name: Mises Institute
    category: libertarian
    
  "fee.org":
    bias: 1
