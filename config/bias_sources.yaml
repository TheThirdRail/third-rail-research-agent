  "commondreams.org":
    bias: -4
    factual: mostly_factual
    name: Common Dreams

  # === SLIGHT RIGHT (+1) ===
  "realclearpolitics.com":
    bias: 1
    factual: mostly_factual
    name: RealClearPolitics
    
  "axios.com":
    bias: 1
    factual: high
    name: Axios

  # === LEAN RIGHT (+2) ===
  "wsj.com":
    bias: 2
    factual: mostly_factual
    name: Wall Street Journal
    
  "nypost.com":
