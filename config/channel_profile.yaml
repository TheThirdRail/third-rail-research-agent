# Channel Profile Configuration
# This file defines your YouTube channel's focus areas and preferences
# The Research Agent uses this to find and rank relevant stories

channel:
  name: "Your Channel Name"
  description: |
    A libertarian commentary channel covering American politics, 
    geopolitics, and cultural issues from a constitutional/liberty perspective.
    
  worldview: "libertarian"
  worldview_description: |
    Libertarian in the tradition of Ron Paul, Dave Smith, and Thomas Massie.
    Emphasizes individual liberty, constitutional limits on government,
    non-interventionist foreign policy, and free market economics.

# Content approach
content_style:
  # Present facts neutrally first, then clearly labeled opinion
  facts_first: true
  
  # How to label opinion sections
  opinion_marker: "MY TAKE:"
  
  # Preferred report structure
  structure:
    - story_overview
    - agreed_facts
    - disputed_facts  
    - mainstream_narrative
    - alternative_takes
    - libertarian_perspective
    - talking_points

# Topics to monitor (ordered by priority)
topics:
  primary:
    - us_national_politics
    - geopolitics
    - conspiracy_theories
    - breaking_news
    - cultural_issues
    - government_overreach
    - foreign_policy
    
  secondary:
    - spirituality_religion
    - technology
    - political_commentators
    - online_debates
    - florida_politics

# Topic keywords for story discovery
topic_keywords:
  us_national_politics:
    - congress
    - president
    - senate
    - supreme court
    - legislation
    - election
    - republican
    - democrat
    - constitutional
    - federal
    
