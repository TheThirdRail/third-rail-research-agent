# Sources to prioritize
preferred_sources:
  libertarian:
    - reason.com
    - mises.org
    - lewrockwell.com
    - tomwoods.com
    - antiwar.com
    
  independent:
    - theintercept.com
    - consortiumnews.com
    - zerohedge.com
    - realclearpolitics.com
    
  mainstream_for_context:
    - reuters.com
    - apnews.com

# Sources to include for balance (not preferred, but needed for comparison)
balance_sources:
  left:
    - cnn.com
    - msnbc.com
    - nytimes.com
    - washingtonpost.com
    
  right:
    - foxnews.com
    - dailywire.com
    - breitbart.com
    - nypost.com

# Story selection criteria weights (0.0 to 1.0)
ranking_weights:
  topic_relevance: 0.35
  recency: 0.25
  controversy_level: 0.15
  source_diversity: 0.10
  predicted_performance: 0.15  # Based on historical data

# Exclusion rules
exclusions:
  # Skip stories primarily about these (noise reduction)
  topics_to_avoid:
    - celebrity_gossip
    - sports_scores
    - entertainment_news
    
  # Skip stories from these domains
  domains_to_skip:
    - tmz.com
    - buzzfeed.com
    - people.com
