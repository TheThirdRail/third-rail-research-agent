# Bias bucket definitions (for BalancedSourcePlanner)
bias_buckets:
  far_left: [-4]
  left: [-3]
  lean_left: [-2]
  slight_left: [-1]
  center: [0]
  slight_right: [1]
  lean_right: [2]
  right: [3]
  far_right: [4]

# Bucket groups for coverage policy
bucket_groups:
  left_side: [-4, -3, -2, -1]
  center_side: [0]
  right_side: [1, 2, 3, 4]

# Factual rating scale
factual_ratings:
  very_low: 1
  low: 2
  mixed: 3
  mostly_factual: 4
  high: 5
  very_high: 6

# Bias labels
bias_labels:
  -4: "Far Left"
  -3: "Left"
  -2: "Lean Left"
  -1: "Slight Left"
  0: "Center"
  1: "Slight Right"
  2: "Lean Right"
  3: "Right"
  4: "Far Right"

# Refresh settings (RSS)
rss_settings:
  default_max_age_hours: 24
  max_items_per_feed: 10
  request_timeout_seconds: 10
  user_agent: "ResearchAgent/1.0 (News Research Tool)"
