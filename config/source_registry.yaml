# Canonical Source Registry
# Single source of truth for all news outlets used at runtime.
# Merges data from bias_sources.yaml and rss_feeds.yaml.
# Machine-readable docs and human markdown are generated FROM this file.
#
# Schema per outlet:
#   name: Display name
#   domain: Primary domain (lookup key)
#   homepage_url: Homepage URL
#   bias: Integer -4 to +4
#   bias_label: Human-readable bias label
#   category: mainstream | libertarian | independent | alternative | fringe_conspiracy | religion_spiritual | supernatural
#   factual_rating: very_low | low | mixed | mostly_factual | high | very_high
#   rss_urls: List of RSS feed URLs
#   search_aliases: Alternative names/domains for web search
#   syndication_group: Wire service or syndication group (e.g., "ap_wire")
#   allow_in_analysis: Whether this outlet can appear in final analysis source sets
#   notes: Free-form notes

# === Bias Scale ===
# -4: Far Left
# -3: Left
# -2: Lean Left
# -1: Slight Left
#  0: Center
# +1: Slight Right
# +2: Lean Right
# +3: Right
# +4: Far Right

sources:
  # ──────────────────────── CENTER (0) ────────────────────────
  - name: Reuters
    domain: reuters.com
    homepage_url: https://www.reuters.com
    bias: 0
    bias_label: Center
    category: mainstream
    factual_rating: high
    rss_urls:
      - https://www.reutersagency.com/feed/?taxonomy=best-topics&post_type=best
    search_aliases: ["Reuters"]
    syndication_group: reuters_wire
    allow_in_analysis: true
    notes: ""

