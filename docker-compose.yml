# ===========================================
# Research Agent - Docker Compose
# Three-service architecture: backend + frontend + optional local LLM runtime
# ===========================================

services:
  # Python Backend (FastAPI + CrewAI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      # Provider Selection
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - SELECTED_MODEL=${SELECTED_MODEL:-}
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-}
      # API Keys (loaded from .env)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # Local LLM
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LM_STUDIO_API_BASE=${LM_STUDIO_API_BASE:-http://host.docker.internal:1234/v1}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-lm-studio}
      - LM_STUDIO_FALLBACK_ENABLED=${LM_STUDIO_FALLBACK_ENABLED:-true}
      - LM_STUDIO_FALLBACK_MODEL=${LM_STUDIO_FALLBACK_MODEL:-qwen2.5-7b-instruct}
      # Optional Codex OAuth bridge testing
      - CODEX_OAUTH_TESTING_ENABLED=${CODEX_OAUTH_TESTING_ENABLED:-false}
      - CODEX_OAUTH_MODE=${CODEX_OAUTH_MODE:-disabled}
      - CODEX_CLI_COMMAND=${CODEX_CLI_COMMAND:-codex}
      - CODEX_REQUIRE_LOCALHOST=${CODEX_REQUIRE_LOCALHOST:-true}
      - CODEX_ALLOW_PUBLIC_API=${CODEX_ALLOW_PUBLIC_API:-false}
      - CODEX_MAX_PROMPT_CHARS=${CODEX_MAX_PROMPT_CHARS:-30000}
      - CODEX_TIMEOUT_SECONDS=${CODEX_TIMEOUT_SECONDS:-300}
      # Web Search
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-}
      - SEARXNG_API_KEY=${SEARXNG_API_KEY:-}
      # Database
      - DATABASE_URL=sqlite:///data/research_agent.db
      # App Settings
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CREWAI_TRACING_ENABLED=false
      # Encoding
      - PYTHONIOENCODING=utf-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js Frontend
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # This URL is baked into the client bundle at build time
        # Must be reachable from the USER'S BROWSER
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: research-agent-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - INTERNAL_API_URL=http://backend:8000
    restart: unless-stopped

  # Ollama (Optional local LLM; LM Studio can be used from host via LM_STUDIO_API_BASE)
  ollama:
    image: ollama/ollama:latest
    container_name: research-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    profiles:
      - local-llm # Only starts with: docker compose --profile local-llm up

volumes:
  ollama-data:
    driver: local

networks:
  default:
    name: research-agent-network
