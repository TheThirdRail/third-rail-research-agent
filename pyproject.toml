[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "AI-powered news research and political bias analysis for YouTube creators"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "TheThirdRail" }
]
keywords = ["ai", "agents", "crewai", "news", "research", "bias", "youtube"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Agent Framework
    "crewai[google-genai]>=0.95.0",
    "crewai-tools>=0.14.0",
    "litellm>=1.83.7",
    "openai>=1.0.0",  # For API compatibility with multiple providers
    "tiktoken>=0.7.0",
    
    # News & Web
    "feedparser>=6.0.0",
    "ddgs>=6.0.0",
    "trafilatura>=1.12.0",
    "newspaper4k>=0.9.0",
    "lxml>=6.1.0",
    
    # Keyword Analysis
    "yake>=0.4.8",
    
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "lancedb>=0.30.0",
    
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.27,<0.1",  # For file uploads
    "aiofiles>=24.1.0",  # For async file operations
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    
    # CLI
    "click>=8.1.0",
    "rich>=13.9.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "markdown>=3.6.0",
    "bleach>=6.2.0",
    "playwright>=1.41.0",
    "selenium>=4.28.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.10.0",
    "bandit>=1.8.0",
]

ml = [
    # Optional: Better keyword extraction (requires more dependencies)
    "keybert>=0.8.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
research-agent = "src.cli.main:cli"

[project.urls]
Homepage = "https://github.com/TheThirdRail/third-rail-research-agent"
Documentation = "https://github.com/TheThirdRail/third-rail-research-agent#readme"
Repository = "https://github.com/TheThirdRail/third-rail-research-agent"
Issues = "https://github.com/TheThirdRail/third-rail-research-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff Configuration
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

# Mypy Configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["crewai.*", "ddgs.*", "trafilatura.*", "newspaper.*", "yake.*", "feedparser.*"]
ignore_missing_imports = true

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: tests that require external services, browsers, live providers, OCR binaries, Docker, or network access",
]
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated, use ConfigDict instead.*:pydantic.warnings.PydanticDeprecatedSince20",
]
